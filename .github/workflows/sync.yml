name: Sync diário

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC = 06:00 BRT
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install -e ".[dev]"

      - name: Roda o sync
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python -m sync

      - name: Commit e push se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add -f site/data/

          if git diff --staged --quiet; then
            echo "nada mudou, sem commit"
            exit 0
          fi

          git commit -m "chore: sync diário do catálogo"

          # git push pode ser rejeitado se o master remoto avançou entre o
          # checkout deste job e este ponto (ex.: um push manual acontecendo
          # ao mesmo tempo do cron) -- não é um erro real do sync, só uma
          # corrida comum em qualquer repo com mais de um escritor. Em vez
          # de falhar na primeira rejeição, tenta de novo com rebase.
          sucesso=false
          for tentativa in 1 2 3; do
            if git push; then
              sucesso=true
              break
            fi
            echo "push rejeitado (tentativa $tentativa/3) -- rebase e tenta de novo"
            git fetch origin master
            git rebase origin/master
          done

          if [ "$sucesso" != "true" ]; then
            echo "push falhou apos 3 tentativas de rebase"
            exit 1
          fi

      - name: Abre issue se o sync falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync diário falhou em ${new Date().toISOString().slice(0, 10)}`,
              body: `O workflow de sync falhou. Ver o run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["sync-falhou"],
            });
